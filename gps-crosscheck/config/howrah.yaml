# ---------------------------------------------------------------------------
# Division settings for the GPS cross-check.
# To use this in another division: copy this file, change the values,
# and point the workflow at the new file (DIVISION_CONFIG).
# Passwords are NOT kept here. They come from GitHub Secrets.
# ---------------------------------------------------------------------------

division: Howrah
timezone: Asia/Kolkata

sheet:
  # Google Sheet that the control team fills (must be viewable by link)
  id: 1-EWkp8nq5aL_BKs3MQymexS-1gjrrXtPbLu1ZCZ1_FI
  keyman_tab: "(Keyman) GPS monitoring & excep"   # name as it appears in the Excel export (Excel cuts names at 31 chars)
  cwp_tab: "Cold Weather Patrolling"

portals:
  rilapp:
    base_url: https://ip3.rilapp.com/railways/
    user_env: RILAPP_USER
    password_env: RILAPP_PASSWORD
  nbtrack:
    api_url: https://api.nbtrack.in/api/v1
    user_env: NBTRACK_USER
    password_env: NBTRACK_PASSWORD

# Time windows checked by the morning run on day D (local time).
windows:
  cwp_night:      { from_day: -1, from: "22:00", to_day: 0, to: "08:00" }   # night D-1 -> D, full check
  keyman_start:   { from_day: 0,  from: "04:00", to_day: 0, to: "08:00" }   # keyman day D, start only
  keyman_full:    { from_day: -1, from: "04:00", to_day: -1, to: "16:00" }  # keyman day D-1, completion

# Default tolerances. These can be changed from the dashboard;
# the dashboard values always win over these.
defaults:
  start_tolerance_min: 15        # allowed difference in start time
  end_tolerance_min: 15          # allowed difference in end time
  km_min_percent: 90             # GPS km must be at least this % of the beat km
  sheet_km_tolerance_percent: 10 # sheet km vs GPS km
  max_walking_speed_kmph: 5      # above this (sustained) = high speed
  speed_spike_points: 2          # fewer consecutive high-speed points than this = GPS jitter, not real
  photo_vs_gps_max_km: 1.0       # photo location vs GPS position at that time
  photo_max_delay_min: 120       # stamp older than WhatsApp time by more than this = old photo
  photo_ahead_tolerance_min: 2   # stamp later than WhatsApp time by more than this = tampered
  gps_gap_switched_off_min: 30   # no GPS point for this long during duty = switched off

# Rough box around the division. A photo whose coordinates fall outside is flagged.
valid_area:
  lat_min: 21.5
  lat_max: 24.5
  lon_min: 86.5
  lon_max: 89.0

# Night (dark) hours for the daylight test, local time.
night_hours: { from: "18:00", to: "05:45" }
