<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--red:#c5221f;--redbg:#fce8e6;--amb:#b06000;--ambbg:#fef7e0;--chk:#1a56c4;--chkbg:#e8f0fe;--ok:#137333;--okbg:#e6f4ea;
        --ink:#1f1f1f;--mute:#5f6368;--line:#e3e3e3;--bg:#f6f7f9}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  h1{font-size:17px;margin:0 12px 0 0;font-weight:650}
  select,input,button{font:inherit;border:1px solid #cfd3d8;border-radius:8px;padding:6px 10px;background:#fff}
  button{cursor:pointer}
  button.primary{background:#1a56c4;color:#fff;border-color:#1a56c4}
  button:disabled{opacity:.55;cursor:default}
  .spacer{flex:1}
  main{padding:14px 16px;max-width:1500px;margin:auto}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
  .tile b{display:block;font-size:24px;font-weight:650}
  .tile span{color:var(--mute);font-size:12.5px}
  .tile.on{outline:2px solid #1a56c4}
  .red b{color:var(--red)} .amber b{color:var(--amb)} .chk b{color:var(--chk)} .ok b{color:var(--ok)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .tabs button{border-radius:999px}
  .tabs button.on{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
  .card{background:#fff;border:1px solid var(--line);border-left:5px solid #ccc;border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .card.RED{border-left-color:var(--red)} .card.AMBER{border-left-color:var(--amb)} .card.CHECK{border-left-color:var(--chk)} .card.OK{border-left-color:var(--ok)}
  .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px}
  .chip.RED{background:var(--redbg);color:var(--red)} .chip.AMBER{background:var(--ambbg);color:var(--amb)}
  .chip.CHECK{background:var(--chkbg);color:var(--chk)} .chip.OK{background:var(--okbg);color:var(--ok)}
  .beat{font-weight:600} .mute{color:var(--mute);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
  .cell{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:12.5px}
  .cell h4{margin:0 0 2px;font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  ul{margin:4px 0 0;padding-left:18px} li{margin:2px 0}
  li.high{color:var(--red)} li.medium{color:var(--amb)} li.check{color:var(--chk)} li.low{color:var(--mute)}
  .v{display:inline-block;font-size:11px;font-weight:650;padding:0 6px;border-radius:5px;margin-right:4px}
  .v.CONFIRMED{background:var(--redbg);color:var(--red)} .v.FALSE{background:var(--okbg);color:var(--ok)} .v.CANNOT{background:#eee;color:#555}
  .links a{margin-right:12px;font-size:12.5px;color:#1a56c4;text-decoration:none}
  .empty{padding:40px;text-align:center;color:var(--mute)}
  dialog{border:none;border-radius:14px;max-width:640px;width:92%;padding:0}
  dialog form{padding:16px 18px}
  dialog label{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
  .note{background:var(--chkbg);color:#174ea6;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
  @media (max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media print{header,.bar,.tiles{display:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>GPS Cross-check</h1>
  <label class="mute">Run date</label><select id="run"></select>
  <span class="mute" id="runinfo"></span>
  <span class="spacer"></span>
  <button id="xl">Excel</button><button id="pdf">PDF</button>
  <button id="set">Settings</button>
  <button class="primary" id="go">Run now</button>
</header>
<main>
  <div id="msg"></div>
  <div class="tiles" id="tiles"></div>
  <div class="bar tabs" id="tabs"></div>
  <div class="bar">
    <select id="fsec"><option value="">All sections</option></select>
    <select id="faen"><option value="">All AENs</option></select>
    <select id="fv"><option value="">Portal exceptions: any</option><option value="FALSE">Portal exception found FALSE</option>
      <option value="CONFIRMED">Portal exception CONFIRMED</option></select>
    <input id="q" placeholder="Search beat, name, GPS no…" size="26">
    <span class="mute" id="count"></span>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<dialog id="dlg"><form method="dialog">
  <h3 style="margin:0 0 4px">Settings</h3>
  <div class="mute">Used by the next run. Re-run a date to apply them to it.</div>
  <div id="fields"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
    <button value="cancel">Cancel</button><button class="primary" id="save" value="save">Save</button>
  </div>
</form></dialog>

<script>
var KEY = <?= JSON.stringify(key) ?>;
var rows = [], st = {check:'', status:''};
var $ = function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(html){$('msg').innerHTML = html ? '<div class="note">'+html+'</div>' : ''}
function call(fn){var args=[].slice.call(arguments,1);return new Promise(function(ok,bad){
  google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn].apply(null,[KEY].concat(args))})}

call('listRuns').then(function(runs){
  if(!runs.length){$('list').innerHTML='<div class="empty">No results yet. The first run will appear here.</div>';return}
  $('run').innerHTML = runs.map(function(r){return '<option value="'+r.run_date+'">'+r.run_date+'</option>'}).join('');
  $('run').onchange=function(){load(runs.filter(function(r){return r.run_date===$('run').value})[0])};
  load(runs[0]);
}).catch(function(e){msg('Could not load: '+esc(e.message))});

function load(run){
  $('runinfo').textContent = run.at ? 'received '+run.at : '';
  $('list').innerHTML='<div class="empty">Loading…</div>';
  call('getRun', run.run_date).then(function(r){rows=r; buildFilters(); render()});
}

function buildFilters(){
  var secs={}, aens={};
  rows.forEach(function(r){if(r.pwi)secs[r.pwi]=1; if(r.aen)aens[r.aen]=1});
  $('fsec').innerHTML='<option value="">All sections</option>'+Object.keys(secs).sort().map(function(s){return '<option>'+esc(s)+'</option>'}).join('');
  $('faen').innerHTML='<option value="">All AENs</option>'+Object.keys(aens).sort().map(function(s){return '<option>'+esc(s)+'</option>'}).join('');
  var checks=['','CWP night','Keyman start','Keyman full day'];
  $('tabs').innerHTML=checks.map(function(c){
    var n=rows.filter(function(r){return !c||r.check===c}).length;
    return '<button data-c="'+c+'" class="'+(st.check===c?'on':'')+'">'+(c||'All')+' · '+n+'</button>'}).join('');
  [].forEach.call($('tabs').children,function(b){b.onclick=function(){st.check=b.dataset.c;buildFilters();render()}});
}

function filtered(){
  var q=$('q').value.toLowerCase(), sec=$('fsec').value, aen=$('faen').value, fv=$('fv').value;
  return rows.filter(function(r){
    if(st.check && r.check!==st.check) return false;
    if(st.status && r.status!==st.status) return false;
    if(sec && r.pwi!==sec) return false;
    if(aen && r.aen!==aen) return false;
    if(fv && !r.portal_exceptions.some(function(v){return v.verdict===fv})) return false;
    if(q && (r.beat+' '+r.names+' '+r.gps_in_sheet+' '+r.portal_device).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}

function tiles(list){
  var c={RED:0,AMBER:0,CHECK:0,OK:0}, v={CONFIRMED:0,FALSE:0,'CANNOT VERIFY':0};
  list.forEach(function(r){c[r.status]++; r.portal_exceptions.forEach(function(x){v[x.verdict]++})});
  var t=[['RED','red','Serious'],['AMBER','amber','Mismatch'],['CHECK','chk','Check by eye'],['OK','ok','All clear']];
  $('tiles').innerHTML=t.map(function(x){return '<div class="tile '+x[1]+(st.status===x[0]?' on':'')+'" data-s="'+x[0]+'"><b>'+c[x[0]]+'</b><span>'+x[2]+'</span></div>'}).join('')+
    '<div class="tile"><b>'+v.CONFIRMED+'</b><span>Portal exceptions confirmed</span></div>'+
    '<div class="tile ok"><b>'+v.FALSE+'</b><span>Portal exceptions found false</span></div>';
  [].forEach.call(document.querySelectorAll('.tile[data-s]'),function(el){el.onclick=function(){st.status=st.status===el.dataset.s?'':el.dataset.s;render()}});
}

function render(){
  var all=rows.filter(function(r){return !st.check||r.check===st.check});
  tiles(all);
  var list=filtered();
  $('count').textContent=list.length+' shown';
  if(!list.length){$('list').innerHTML='<div class="empty">Nothing matches.</div>';return}
  var order={RED:0,AMBER:1,CHECK:2,OK:3};
  list.sort(function(a,b){return order[a.status]-order[b.status]});
  $('list').innerHTML=list.slice(0,600).map(card).join('')+(list.length>600?'<div class="empty">First 600 shown – narrow the filters or export.</div>':'');
}

function card(r){
  var f=r.findings.filter(function(x){return x.code!=='PORTAL_FALSE_EXCEPTION'});
  return '<div class="card '+r.status+'"><div class="top"><span class="chip '+r.status+'">'+r.status+'</span>'+
    '<span class="beat">'+esc(r.pwi)+' · '+esc(r.beat)+'</span><span class="mute">'+esc(r.check)+' · duty '+esc(r.duty_date)+' · roster '+esc(r.roster)+'</span></div>'+
    '<div class="mute">'+esc(r.names)+' · GPS '+esc(r.gps_in_sheet)+(r.portal_device?' → '+esc(r.portal_device):'')+'</div>'+
    '<div class="grid">'+
      cell('Sheet', (r.sheet_start||'-')+' → '+(r.sheet_end||'-')+'<br>'+esc(r.sheet_km||'-')+' km')+
      cell('GPS', (r.gps_start||'-')+' → '+(r.gps_end||'-')+'<br>'+(r.gps_km||'-')+' km, max '+(r.gps_max_speed||'-')+' km/h')+
      cell('Photos', 'start '+(r.start_photo_time||'-')+(r.end_photo_time?'<br>end '+r.end_photo_time:''))+
      cell('Actual start', (r.actual_start||'-')+(r.actual_start_from?' ('+r.actual_start_from+')':''))+
    '</div>'+
    (f.length?'<ul>'+f.map(function(x){return '<li class="'+x.severity+'">'+esc(x.message)+'</li>'}).join('')+'</ul>':'')+
    (r.portal_exceptions.length?'<div style="margin-top:6px"><span class="mute">Portal says:</span><ul>'+r.portal_exceptions.map(function(v){
      return '<li><span class="v '+v.verdict.split(' ')[0]+'">'+v.verdict+'</span>'+esc(v.exception)+' – '+esc(v.reason)+'</li>'}).join('')+'</ul></div>':'')+
    '<div class="links" style="margin-top:6px"><a target="_blank" href="'+esc(r.sheet_link)+'">Sheet row</a>'+
      (r.start_photo?'<a target="_blank" href="'+esc(r.start_photo)+'">Start photo</a>':'')+
      (r.end_photo?'<a target="_blank" href="'+esc(r.end_photo)+'">End photo</a>':'')+'</div></div>';
}
function cell(h,b){return '<div class="cell"><h4>'+h+'</h4>'+b+'</div>'}

['fsec','faen','fv'].forEach(function(id){$(id).onchange=render});
$('q').oninput=render;

function exp(fmt){
  var b=$(fmt==='pdf'?'pdf':'xl'); b.disabled=true; msg('Preparing '+(fmt==='pdf'?'PDF':'Excel')+'…');
  call('exportRows',$('run').value,filtered(),fmt).then(function(f){
    msg('Ready: <a target="_blank" href="'+f.url+'">'+esc(f.name)+'</a> (saved in Drive › GPS Cross-check exports)');b.disabled=false;
  }).catch(function(e){msg('Export failed: '+esc(e.message));b.disabled=false});
}
$('xl').onclick=function(){exp('xlsx')}; $('pdf').onclick=function(){exp('pdf')};

$('go').onclick=function(){
  var d=prompt('Run the check for which date? (YYYY-MM-DD, blank = today)','');
  if(d===null) return;
  call('runNow',d).then(function(r){
    if(r.started) msg('Started. Results appear here in about 15 minutes. <a target="_blank" href="'+r.open+'">Progress on GitHub</a>');
    else{ msg((r.error?esc(r.error)+'. ':'')+'Press "Run workflow" on the GitHub page that opened.'); window.open(r.open,'_blank'); }
  });
};

$('set').onclick=function(){
  call('settingsForDashboard').then(function(list){
    $('fields').innerHTML=list.map(function(s){return '<label>'+esc(s.help)+'<input type="number" step="any" min="0" name="'+s.key+'" value="'+esc(s.value)+'"></label>'}).join('');
    $('dlg').showModal();
  });
};
$('save').onclick=function(e){
  e.preventDefault(); var v={};
  [].forEach.call($('fields').querySelectorAll('input'),function(i){v[i.name]=i.value});
  call('saveSettings',v).then(function(){$('dlg').close();msg('Settings saved. They apply from the next run.')})
    .catch(function(err){alert(err.message)});
};
</script>
</body>
</html>
