# Daily GPS cross-check (code in gps-crosscheck/). See gps-crosscheck/README.md.
name: GPS cross-check

on:
  schedule:
    - cron: "35 2 * * *"        # 08:05 IST every day (02:35 UTC)
  workflow_dispatch:
    inputs:
      date:
        description: "Run date YYYY-MM-DD (blank = today)"
        required: false
        default: ""
      only:
        description: "cwp or keyman (blank = both)"
        required: false
        default: ""

concurrency:
  group: gps-crosscheck
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: gps-crosscheck
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gps-crosscheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gps-crosscheck/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the cross-check
        env:
          DIVISION_CONFIG: config/howrah.yaml
          RILAPP_USER: ${{ secrets.RILAPP_USER }}
          RILAPP_PASSWORD: ${{ secrets.RILAPP_PASSWORD }}
          NBTRACK_USER: ${{ secrets.NBTRACK_USER }}
          NBTRACK_PASSWORD: ${{ secrets.NBTRACK_PASSWORD }}
          RESULTS_URL: ${{ secrets.RESULTS_URL }}
          RESULTS_KEY: ${{ secrets.RESULTS_KEY }}
          IN_DATE: ${{ inputs.date }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          ARGS=()
          if [[ "$IN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then ARGS+=(--date "$IN_DATE"); fi
          if [[ "$IN_ONLY" == "cwp" || "$IN_ONLY" == "keyman" ]]; then ARGS+=(--only "$IN_ONLY"); fi
          python -m xcheck.run "${ARGS[@]}"
